<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexPlay | Cricket Arena</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070b10;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 25px;
}

header {
    display: flex;
    justify-content: space-between;
    max-width: 850px;
    margin: auto;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #a3ff12;
}

a {
    color: #a3ff12;
    text-decoration: none;
}

.game {
    background: #111a22;
    max-width: 850px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 18px;
    border: 1px solid #263746;
}

h1 {
    color: #a3ff12;
    margin: 20px;
}

.score {
    display: flex;
    justify-content: space-around;
    margin: 30px 0;
    gap: 10px;
}

.box {
    background: #070b10;
    padding: 20px;
    border-radius: 10px;
    flex: 1;
}

.box h2 {
    color: #a3ff12;
}

.pitch {
    background: #205638;
    padding: 35px 10px;
    border-radius: 12px;
    margin: 20px 0;
}

#message {
    font-size: 20px;
    margin: 15px;
    font-weight: bold;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
}

button {
    background: #a3ff12;
    color: black;
    border: none;
    padding: 15px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #c1ff65;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

#reset {
    background: #263746;
    color: white;
    margin-top: 20px;
}

@media(max-width:550px) {
    .buttons {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">NEX<span>PLAY</span></div>
    <a href="/">← Home</a>
</header>

<div class="game">

    <h1>🏏 Cricket Arena</h1>
    <p>Play Your Cricket Match!</p>

    <div class="score">

        <div class="box">
            <p>RUNS</p>
            <h2 id="runs">0</h2>
        </div>

        <div class="box">
            <p>WICKETS</p>
            <h2 id="wickets">0</h2>
        </div>

        <div class="box">
            <p>BALLS</p>
            <h2 id="balls">0/6</h2>
        </div>

    </div>

    <div class="pitch">
        <h2>🏟️ Cricket Ground</h2>
        <div id="message">Choose Your Shot!</div>
        <p id="result">Match Starting...</p>
    </div>

    <h3>Select Your Shot</h3>

    <br>

    <div class="buttons">
        <button onclick="play(1)">1</button>
        <button onclick="play(2)">2</button>
        <button onclick="play(3)">3</button>
        <button onclick="play(4)">4</button>
        <button onclick="play(5)">5</button>
        <button onclick="play(6)">6</button>
    </div>

    <button id="reset" onclick="resetGame()">
        Play Again ↻
    </button>

</div>

<script>

let runs = 0;
let wickets = 0;
let balls = 0;
let finished = false;

function play(shot) {

    if (finished) return;

    let bowling = Math.floor(Math.random() * 6) + 1;

    balls++;

    if (shot === bowling) {

        wickets++;

        document.getElementById("message").innerText = "OUT! ❌";

    } else {

        runs += shot;

        document.getElementById("message").innerText =
        shot + " Runs Scored! 🏏";

    }

    document.getElementById("result").innerText =
    "Your Shot: " + shot + " | Computer: " + bowling;

    updateScore();

    if (balls === 6 || wickets === 2) {

        finished = true;

        document.getElementById("message").innerText =
        "MATCH OVER! Final Score: " + runs + "/" + wickets;

        document.querySelectorAll(".buttons button")
        .forEach(btn => btn.disabled = true);

    }

}

function updateScore() {

    document.getElementById("runs").innerText = runs;

    document.getElementById("wickets").innerText = wickets;

    document.getElementById("balls").innerText = balls + "/6";

}

function resetGame() {

    runs = 0;
    wickets = 0;
    balls = 0;
    finished = false;

    updateScore();

    document.getElementById("message").innerText =
    "Choose Your Shot!";

    document.getElementById("result").innerText =
    "Match Starting...";

    document.querySelectorAll(".buttons button")
    .forEach(btn => btn.disabled = false);

}

</script>

</body>
</html>
