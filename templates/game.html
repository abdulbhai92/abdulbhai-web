<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPlay - {{ game }}</title>
    <style>
        body {
            margin: 0;
            background: #070b10;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 35px 15px;
        }
        h1 { color: #a3ff12; }
        .arena {
            background: #111a22;
            border: 1px solid #293a30;
            border-radius: 14px;
            max-width: 420px;
            margin: 25px auto;
            padding: 25px;
        }
        .score-box { font-size: 32px; color: #a3ff12; font-weight: bold; margin: 15px 0; }
        #target {
            font-size: 46px;
            background: #18251e;
            border: 2px solid #a3ff12;
            border-radius: 12px;
            width: 90px;
            height: 90px;
            line-height: 90px;
            margin: 20px auto;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
        }
        #target:active { transform: scale(0.9); }
        button {
            padding: 12px 22px;
            background: #a3ff12;
            color: #080d12;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #a3ff12; text-decoration: none; display: inline-block; margin-top: 25px; }
    </style>
</head>
<body>
    <h1>🎮 {{ game }}</h1>
    <p>Tap the target as fast as you can in 15 seconds!</p>

    <div class="arena">
        <div>Time Left: <strong id="time">15</strong>s</div>
        <div class="score-box">Score: <span id="score">0</span></div>
        <div id="target" onclick="hitTarget()">
            {% if game == "Speed Racers" %}🏎️{% elif game == "Space Battle" %}🚀{% else %}⚡{% endif %}
        </div>
        <button onclick="startGame()">START / RESTART</button>
    </div>

    <a href="/">← Back to NexPlay</a>

    <script>
        let score = 0, timeLeft = 15, timer = null, playing = false;

        function startGame() {
            score = 0; timeLeft = 15; playing = true;
            document.getElementById("score").textContent = score;
            document.getElementById("time").textContent = timeLeft;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById("time").textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    playing = false;
                    alert("Time's up! Your score in {{ game }}: " + score);
                }
            }, 1000);
        }

        function hitTarget() {
            if (!playing) startGame();
            score++;
            document.getElementById("score").textContent = score;
        }
    </script>
</body>
</html>
